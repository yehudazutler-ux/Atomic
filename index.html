<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cadence" />
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#070b16" media="(prefers-color-scheme: dark)" />
<title>Cadence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23070b16%27/%3E%3Ctext x=%2750%27 y=%2770%27 font-size=%2762%27 text-anchor=%27middle%27%3E🎯%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --card-press:#e9e9ee;
    --text:#1c1c1e; --text2:rgba(60,60,67,.6); --text3:rgba(60,60,67,.32);
    --sep:rgba(60,60,67,.16); --sep-strong:rgba(60,60,67,.28);
    --accent:#34c759; --accent-deep:#248a3d;
    --warn:#ff9500; --bad:#ff3b30; --blue:#007aff; --violet:#af52de;
    --bar:rgba(249,249,249,.80); --bar-border:rgba(60,60,67,.16);
    --warn-bg:#fff4e5; --bad-bg:#ffe9e7; --ok-bg:#e7f8ed; --neutral-bg:#ececed;

    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --navh:50px; --tabh:50px;
    --radius:14px;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --card:#1c1c1e; --card-press:#2c2c2e;
      --text:#ffffff; --text2:rgba(235,235,245,.6); --text3:rgba(235,235,245,.3);
      --sep:rgba(84,84,88,.55); --sep-strong:rgba(84,84,88,.75);
      --accent:#30d158; --accent-deep:#30d158;
      --warn:#ff9f0a; --bad:#ff453a; --blue:#0a84ff; --violet:#bf5af2;
      --bar:rgba(20,20,22,.80); --bar-border:rgba(84,84,88,.55);
      --warn-bg:#3a2c12; --bad-bg:#3a1f1d; --ok-bg:#14331f; --neutral-bg:#2a2a2c;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Helvetica Neue",system-ui,sans-serif;
    font-size:17px; line-height:1.4;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
  }
  input{user-select:text;-webkit-user-select:text;}
  button{font-family:inherit;color:inherit;cursor:pointer;}

  /* ---------- App shell ---------- */
  .app{position:fixed;inset:0;display:flex;flex-direction:column;}

  .navbar{
    flex:0 0 auto;
    padding-top:var(--safe-t);
    background:var(--bar);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--bar-border);
    z-index:20;
  }
  .navbar .row{
    height:var(--navh);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;
  }
  .navbar .title{font-size:18px;font-weight:700;letter-spacing:-.02em;}
  .navbar .act{
    width:34px;height:34px;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;color:var(--accent);
    border-radius:50%;transition:background .15s;
  }
  .navbar .act:active{background:var(--card-press);}

  .scroll{
    flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .content{
    padding:8px 16px calc(var(--tabh) + var(--safe-b) + 28px);
    max-width:560px;margin:0 auto;
  }
  .largetitle{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:10px 2px 2px;}
  .subtitle{color:var(--text2);font-size:15px;margin:0 2px 16px;font-weight:500;}

  @keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .anim{animation:screenIn .28s var(--ease);}

  /* ---------- Tab bar ---------- */
  .tabbar{
    flex:0 0 auto;
    display:flex;
    padding-bottom:var(--safe-b);
    background:var(--bar);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--bar-border);
    z-index:20;
  }
  .tab{
    flex:1;border:none;background:transparent;
    height:var(--tabh);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--text2);font-size:10px;font-weight:600;letter-spacing:.01em;
    transition:color .15s;
  }
  .tab svg{width:26px;height:26px;}
  .tab.on{color:var(--accent);}
  .tab:active{opacity:.6;}

  /* ---------- Cards / lists ---------- */
  .sectlabel{
    font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
    color:var(--text2);margin:24px 6px 8px;
  }
  .group{
    background:var(--card);border-radius:var(--radius);overflow:hidden;
    box-shadow:0 0 0 .5px var(--sep);
  }
  .item{
    display:flex;align-items:center;gap:14px;
    padding:13px 16px;min-height:58px;position:relative;
    transition:background .12s;
  }
  .item:active{background:var(--card-press);}
  .item + .item::before{
    content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--sep);
  }
  .item .body{flex:1 1 auto;min-width:0;}
  .item .nm{font-size:17px;font-weight:500;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item .hint{font-size:13px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:6px;}
  .item .hint.warn{color:var(--warn);} .item .hint.bad{color:var(--bad);}
  .chev{color:var(--text3);flex:0 0 auto;}

  /* category icon badge */
  .catdot{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .catdot svg{width:14px;height:14px;}
  .cat-daily{background:linear-gradient(135deg,var(--accent),var(--accent-deep));}
  .cat-weekly{background:linear-gradient(135deg,var(--blue),#0055c8);}
  .cat-monthly{background:linear-gradient(135deg,var(--violet),#8a2fc0);}

  /* section header with icon chip */
  .cathead{display:flex;align-items:center;gap:7px;}
  .chip-ico{
    width:18px;height:18px;border-radius:5px;color:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
  }
  .chip-ico svg{width:11px;height:11px;}

  /* streak flame badge */
  .streak{
    display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:700;
    color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1.5px 6px 1.5px 5px;
    margin-left:7px;vertical-align:middle;
  }

  /* per-habit mini trend chart (Progress tab) */
  .spark{display:flex;gap:3px;padding:0 16px;margin-top:9px;}
  .spark i{flex:1;min-width:0;height:15px;border-radius:3px;background:var(--neutral-bg);display:block;}
  .spark i.sk-done{background:linear-gradient(180deg,var(--accent),var(--accent-deep));}
  .spark i.sk-miss{background:color-mix(in srgb,var(--bad) 40%,var(--neutral-bg));}
  .spark i.sk-cur{box-shadow:inset 0 0 0 2px var(--text3);}
  .spark i.sk-pre{opacity:.3;}

  /* check circle */
  .check{
    flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    border:2px solid var(--sep-strong);background:transparent;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s var(--ease),background .15s,border-color .15s,box-shadow .15s;
  }
  .check svg{width:18px;height:18px;color:#fff;opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s var(--ease);}
  .check.done{background:var(--accent);border-color:var(--accent);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 45%,transparent);}
  .check.done svg{opacity:1;transform:scale(1);}
  @keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
  .check.pop{animation:pop .26s var(--ease);}

  /* today progress ring strip */
  .todaybar{
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,var(--card)),var(--card) 65%);
    border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;
    box-shadow:0 0 0 .5px var(--sep);display:flex;align-items:center;gap:16px;margin-bottom:4px;
  }
  .todaybar::after{
    content:"";position:absolute;top:-36px;right:-36px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent) 0%,transparent 72%);
    pointer-events:none;
  }
  .miniring{flex:0 0 auto;width:56px;height:56px;position:relative;}
  .miniring svg{transform:rotate(-90deg);}
  .miniring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:-.02em;}
  .todaybar .tt{font-size:16px;font-weight:600;}
  .todaybar .ts{font-size:14px;color:var(--text2);margin-top:2px;}

  /* ---------- Progress page ---------- */
  .segmented{
    display:flex;background:var(--neutral-bg);border-radius:9px;padding:2px;margin:4px 2px 18px;
  }
  .seg{
    flex:1;border:none;background:transparent;border-radius:7px;
    padding:7px 0;font-size:14px;font-weight:600;color:var(--text);
    transition:background .2s var(--ease),box-shadow .2s;
  }
  .seg.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);}

  .hero{
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card) 60%);
    border-radius:18px;padding:20px;box-shadow:0 0 0 .5px var(--sep);position:relative;overflow:hidden;
    display:flex;align-items:center;gap:20px;
  }
  .hero::after{
    content:"";position:absolute;top:-46px;right:-46px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--accent) 28%,transparent) 0%,transparent 72%);
    pointer-events:none;
  }
  .hero > *{position:relative;}
  .hero .ring{flex:0 0 auto;width:84px;height:84px;position:relative;}
  .hero .ring svg{transform:rotate(-90deg);}
  .hero .ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800;letter-spacing:-.03em;}
  .hero .v.muted{color:var(--text3);}
  .hero .meta{flex:1;}
  .hero .meta .big{font-size:15px;font-weight:600;}
  .hero .chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--neutral-bg);color:var(--text2);}
  .chip.ok{background:var(--ok-bg);color:var(--accent-deep);}
  .chip.bad{background:var(--bad-bg);color:var(--bad);}

  .banner{
    margin-top:14px;border-radius:var(--radius);padding:13px 15px;font-size:14px;font-weight:500;
    display:flex;gap:10px;align-items:flex-start;
  }
  .banner.bad{background:var(--bad-bg);color:var(--bad);}
  .banner.ok{background:var(--ok-bg);color:var(--accent-deep);}
  .banner b{font-weight:700;}

  .heat{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
  .heat.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .hd{aspect-ratio:1;border-radius:6px;background:var(--neutral-bg);position:relative;}
  .hd.p1{background:color-mix(in srgb,var(--accent) 45%,var(--neutral-bg));}
  .hd.p2{background:color-mix(in srgb,var(--accent) 100%,transparent);}
  .hd .dl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text2);}
  .hd.p2 .dl{color:#fff;}
  .heat.week{display:grid;grid-template-columns:repeat(7,1fr);}
  .heat.week .col{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .heat.week .col .dn{font-size:11px;color:var(--text2);font-weight:600;}

  .prow{display:flex;align-items:center;gap:12px;padding:12px 16px;}
  .prow .pn{flex:1;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .prow .pp{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:42px;text-align:right;}
  .prow .pp.muted{color:var(--text3);}
  .bar{height:7px;border-radius:4px;background:var(--neutral-bg);overflow:hidden;margin-top:7px;}
  .bar > i{display:block;height:100%;border-radius:4px;transition:width .5s var(--ease);}
  .prowwrap + .prowwrap::before{content:"";display:block;height:.5px;background:var(--sep);margin-left:16px;}
  .prowwrap{padding-bottom:11px;}
  .prowwrap .cnt{font-size:12px;color:var(--text2);padding:0 16px;font-variant-numeric:tabular-nums;}

  /* ---------- Shnayim Mikra ---------- */
  .wknav{display:flex;align-items:center;gap:8px;margin:4px 0 14px;}
  .wkb{
    flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:none;
    background:var(--card);box-shadow:0 0 0 .5px var(--sep);
    font-size:24px;line-height:1;color:var(--blue);display:flex;align-items:center;justify-content:center;
    transition:background .12s;
  }
  .wkb:active{background:var(--card-press);}
  .wkb:disabled{opacity:.3;color:var(--text3);}
  .wkmid{flex:1;text-align:center;min-width:0;}
  .wkp{font-size:21px;font-weight:800;letter-spacing:-.02em;}
  .wkd{font-size:12.5px;color:var(--text2);margin-top:1px;}

  .aliyah{
    background:var(--card);border-radius:var(--radius);box-shadow:0 0 0 .5px var(--sep);
    padding:13px 14px 14px;margin-bottom:10px;
    border-left:3px solid transparent;transition:border-color .2s;
  }
  .aliyah.full{border-left-color:var(--accent);}
  .ahead{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .anum{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:var(--neutral-bg);color:var(--text2);
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .aliyah.full .anum{background:var(--accent);color:#fff;}
  .aref{flex:1;font-size:13.5px;color:var(--text2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .acount{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--text3);font-variant-numeric:tabular-nums;}
  .aliyah.full .acount{color:var(--accent);}

  .smrow{display:flex;gap:5px;}
  .smitem{
    flex:1 1 0;min-width:0;border:none;background:transparent;padding:0;
    display:flex;flex-direction:column;align-items:center;gap:5px;
  }
  .smbox{
    width:100%;max-width:52px;aspect-ratio:1;border-radius:12px;
    border:2px solid var(--sep-strong);background:var(--card);
    display:flex;align-items:center;justify-content:center;color:#fff;
    transition:transform .14s var(--ease),background .15s,border-color .15s;
  }
  .smbox svg{width:20px;height:20px;}
  .smitem.on .smbox{background:var(--accent);border-color:var(--accent);}
  .smitem:active .smbox{transform:scale(.9);}
  .smlab{font-size:10.5px;font-weight:600;color:var(--text2);line-height:1;text-align:center;}
  .smlab sup{font-size:8px;margin-left:1px;}
  .smitem.on .smlab{color:var(--accent);}

  .credit{text-align:center;color:var(--text3);font-size:11.5px;margin:18px 0 0;}

  /* ---------- Daily Learning ---------- */
  .learnrow{
    display:flex;align-items:flex-start;gap:14px;width:100%;cursor:pointer;
    border:none;background:var(--card);font:inherit;color:inherit;text-align:left;
    padding:13px 16px;position:relative;transition:background .12s;
  }
  .learnrow:active{background:var(--card-press);}
  .learnrow + .learnrow::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--sep);}
  .learnrow .check{margin-top:1px;}
  .learnrow .body{flex:1 1 auto;min-width:0;text-align:left;}
  .learnrow .lnm{font-size:13px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:var(--text2);}
  .learnrow .ltxt{font-size:16px;margin-top:2px;line-height:1.35;color:var(--text);}
  .learnrow.on .ltxt{color:var(--text2);text-decoration:line-through;}
  .pacecap{margin-top:6px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--blue);font-weight:600;}
  .unbm{border:none;background:var(--neutral-bg);color:var(--text2);font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;}
  .unbm:active{background:var(--card-press);}
  .pinbtn{border:none;background:var(--neutral-bg);color:var(--blue);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;}
  .pinbtn.on{background:var(--ok-bg);color:var(--accent-deep);}
  .pinbtn:active{filter:brightness(.95);}

  /* ---------- Settings ---------- */
  .info{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 0 0 .5px var(--sep);font-size:15px;color:var(--text2);line-height:1.5;}
  .info b{color:var(--text);font-weight:600;}
  .btnrow{border:none;background:var(--card);width:100%;text-align:left;padding:15px 16px;font-size:17px;display:flex;align-items:center;justify-content:space-between;transition:background .12s;}
  .btnrow:active{background:var(--card-press);}
  .btnrow.danger{color:var(--bad);}
  .btnrow .ic{color:var(--text3);}

  /* ---------- Empty ---------- */
  .empty{text-align:center;color:var(--text2);padding:50px 24px;}
  .empty .ico{
    font-size:36px;width:88px;height:88px;line-height:88px;margin:0 auto 14px;border-radius:50%;
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,var(--card)),var(--card) 70%);
    box-shadow:0 0 0 .5px var(--sep);
  }
  .empty .et{font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .empty .seed{margin-top:18px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(52,199,89,.3);}
  .empty .seed:active{filter:brightness(.94);}

  /* ---------- Bottom sheet ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;
    transition:opacity .35s var(--ease);z-index:40;
  }
  .backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--bg);
    border-radius:16px 16px 0 0;
    transform:translateY(105%);
    transition:transform .42s var(--ease);
    padding:8px 18px calc(20px + var(--safe-b));
    box-shadow:0 -10px 40px rgba(0,0,0,.2);
    max-width:560px;margin:0 auto;
  }
  .sheet.show{transform:translateY(0);}
  .grabber{width:38px;height:5px;border-radius:3px;background:var(--text3);margin:6px auto 12px;}
  .sheet h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:2px 2px 16px;text-align:center;}
  .field{
    width:100%;font-size:17px;border:none;background:var(--card);border-radius:12px;
    padding:15px 16px;color:var(--text);box-shadow:0 0 0 .5px var(--sep);margin-bottom:14px;
  }
  .field::placeholder{color:var(--text3);}
  .field:focus{outline:2px solid var(--accent);}
  .seglabel{font-size:13px;font-weight:600;color:var(--text2);margin:2px 4px 8px;text-transform:uppercase;letter-spacing:.02em;}
  .save{
    width:100%;border:none;background:var(--accent);color:#fff;border-radius:14px;
    padding:16px;font-size:17px;font-weight:700;margin-top:6px;
    box-shadow:0 6px 18px rgba(52,199,89,.32);transition:filter .12s,transform .12s;
  }
  .save:active{filter:brightness(.93);transform:scale(.99);}
  .save:disabled{opacity:.4;box-shadow:none;}
  .ghost{width:100%;border:none;background:transparent;color:var(--blue);padding:14px;font-size:17px;font-weight:500;margin-top:4px;}
  .delbtn{width:100%;border:none;background:var(--card);color:var(--bad);border-radius:14px;padding:15px;font-size:17px;font-weight:600;margin-top:12px;box-shadow:0 0 0 .5px var(--sep);}
  .delbtn:active{background:var(--card-press);}
  .restartbtn{width:100%;border:none;background:var(--card);color:var(--blue);border-radius:14px;padding:15px;font-size:17px;font-weight:600;margin-top:12px;box-shadow:0 0 0 .5px var(--sep);}
  .restartbtn:active{background:var(--card-press);}

  /* editable history strip */

/* Link your habits to the spreadsheet by a permanent ID (never by position).
   First time: an existing habit with the same name is linked (its history stays attached).
   After that: the ID keeps the link even if you rename it in the spreadsheet. */
function syncHabits(list){
  var now=dKey(new Date()), inList={}, linked=[];
  list.forEach(function(sh){ inList[sh.id]=true; });
  list.forEach(function(sh){
    var h=null,j,x;
    for(j=0;j<state.habits.length;j++){ if(state.habits[j].sid===sh.id){ h=state.habits[j]; break; } }
    if(!h){ /* first link: match the habit's ORIGINAL name (so a rename in the spreadsheet can't orphan history), then its current name */
      var tries=[(LEGACY[sh.id]||'').toLowerCase(), sh.name.toLowerCase()], t;
      for(t=0;t<tries.length&&!h;t++){ if(!tries[t]) continue;
        for(j=0;j<state.habits.length;j++){ x=state.habits[j]; if(!x.sid&&x.name.toLowerCase()===tries[t]){ h=x; break; } } } }
    if(!h){ h={id:'s_'+sh.id,name:sh.name,cat:sh.cat,created:now}; state.habits.push(h); }
    h.sid=sh.id; h.name=sh.name; h.cat=sh.cat; h.paused=!sh.active; h.ord=sh.order;
    linked.push(h);
  });
  /* removed from the spreadsheet: keep everything, just make it an ordinary editable habit */
  state.habits.forEach(function(h){ if(h.sid&&!inList[h.sid]){ delete h.sid; delete h.paused; delete h.ord; } });
  var rest=state.habits.filter(function(h){return !h.sid;});
  linked.sort(function(a,b){return a.ord-b.ord;});
  state.habits=linked.concat(rest);
  state.seedv=SEED_VERSION; save();
}
function applyContent(c){
  CONTENT_META=c; SCHEDULE=c.shnayim||[]; DAILY=c.daily||[];
  buildContentIndex(); migrateBookmarks();
  /* a device you deliberately reset stays empty until you tap "Add starter habits" */
  if(!(state.seedv===SEED_VERSION&&state.habits.length===0)) syncHabits(c.habits||[]);
}
function fetchFreshContent(manual){
  if(!window.fetch||location.protocol==='file:'){ if(manual){ refreshMsg='Updates only work on the live site.'; render(); } return; }
  fetch('data/content.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(c){
      if(!c||!c.daily||!c.habits||!c.shnayim) throw new Error('bad data');
      cacheContent(c);
      if(!CONTENT_META||c.generated!==CONTENT_META.generated){
        applyContent(c);
        if(smIdx>=SCHEDULE.length) smIdx=smIndexForToday();
        if(learnIdx>=DAILY.length) learnIdx=learnIndexForToday();
        if(manual) refreshMsg='Updated just now.';
        render();
      } else if(manual){ refreshMsg='Already up to date.'; render(); }
    })
    .catch(function(){ if(manual){ refreshMsg='Could not reach the update file. Your saved copy is still in use.'; render(); } });
}

/* ===================== dates ===================== */
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function addWeeks(d,n){return addDays(d,n*7);}
function pad(n){return String(n).padStart(2,'0');}
function dKey(d){var x=sod(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function weekStart(d){var x=sod(d);var day=(x.getDay()+6)%7;return addDays(x,-day);} // Monday
function wKey(d){return 'W'+dKey(weekStart(d));}
function monthStart(d){var x=sod(d);return new Date(x.getFullYear(),x.getMonth(),1);}
function addMonths(d,n){var x=monthStart(d);return new Date(x.getFullYear(),x.getMonth()+n,1);}
function mKey(d){var x=monthStart(d);return x.getFullYear()+'-'+pad(x.getMonth()+1);}
function periodKey(cat,d){return cat==='daily'?dKey(d):cat==='weekly'?wKey(d):mKey(d);}
function periodStart(cat,d){return cat==='daily'?sod(d):cat==='weekly'?weekStart(d):monthStart(d);}

/* Parse a stored 'YYYY-MM-DD' as a LOCAL date (new Date(str) would read it as
   UTC and shift it a day earlier in western time zones). */
function parseLocal(s){
  if(s instanceof Date) return s;
  var p=String(s).split('-');
  return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);
}
/* Convert a period key back to its local start date. */
function keyToStart(cat,k){
  if(cat==='daily') return parseLocal(k);
  if(cat==='weekly') return parseLocal(k.slice(1)); // 'W2026-06-23' -> '2026-06-23'
  var p=k.split('-'); return new Date(+p[0],(+p[1])-1,1);
}
/* Effective start: the earlier of when the habit was created and the earliest
   day the user has logged. Marking an older day "extends" history back, so
   backfilled completions count and nothing before your real start is a "miss". */
function startPS(h){
  var base=periodStart(h.cat,parseLocal(h.created));
  var log=state.log[h.id]; if(!log) return base;
  var earliest=base;
  for(var k in log){ if(log[k]){ var s=keyToStart(h.cat,k); if(s<earliest) earliest=s; } }
  return earliest;
}

 [/mishnay|mishna/i,'📚'],[/tehillim|psalm/i,'🎶'],[/cheshbon|account|reflect|journal/i,'🧭'],

];
function habitEmoji(h){
  if(h&&h.emo) return h.emo;
  var n=(h&&h.name)||'';
  for(var i=0;i<EMO_RULES.length;i++) if(EMO_RULES[i][0].test(n)) return EMO_RULES[i][1];
  return CATEMO[h&&h.cat]||'🎯';
}
var LEARN_EMO={gemara:'📜',halacha:'⚖️',mussar:'🌱',mishnayos:'📚',nach:'🕊️',machshava:'💡',chassidus:'🔥',tanya:'🔥',moharan:'💡'};
function learnEmoji(key,label){
  var s=((key||'')+' '+(label||'')).toLowerCase();
  for(var k in LEARN_EMO) if(s.indexOf(k)>-1) return LEARN_EMO[k];
  if(/mach|chass/.test(s)) return '💡';
  return '📖';
}

function sectHead(label,cat){
  return '<div class="sectlabel cathead"><span class="em">'+CATEMO[cat]+'</span>'+label+'</div>';
}
/* current consecutive-completion streak (positive), ending at the most recent
   completed period; the current not-yet-done period doesn't break it, it just
   isn't counted until checked off. */
function posStreak(h){
  var cat=CATS[h.cat], createdPS=startPS(h);
  var ps=buildPeriods(h.cat,cat.window), streak=0;
  for(var i=ps.length-1;i>=0;i--){
    var p=ps[i]; if(p.start<createdPS) break;
    var done=isDone(h.id,p.key);
    if(p.isCurrent&&!done) continue;
    if(!done) break;
    streak++;
  }
  return streak;
}
function streakBadge(h){
  var n=posStreak(h);
  return n>=2 ? '<span class="streak">🔥 '+n+'</span>' : '';
}
/* compact per-habit trend chart for the Progress tab */
function miniSpark(h){
  var cat=CATS[h.cat], eff=startPS(h);
  var ps=buildPeriods(h.cat,cat.strip);
  var bars=ps.map(function(p){
    var done=isDone(h.id,p.key);
    var cls=done?'sk-done':(p.isCurrent?'sk-cur':(p.start>=eff?'sk-miss':'sk-pre'));
    return '<i class="'+cls+'"></i>';
  }).join('');
  return '<div class="spark">'+bars+'</div>';
}

function isDone(id,k){return !!(state.log[id]&&state.log[id][k]);}

function buildPeriods(cat,count){
  var now=new Date(),out=[];
  for(var i=count-1;i>=0;i--){
    var d = cat==='daily'?addDays(now,-i):cat==='weekly'?addWeeks(now,-i):addMonths(now,-i);
    out.push({key:periodKey(cat,d),start:periodStart(cat,d),isCurrent:i===0});
  }
  return out;
}

/* rolling stats: completion rate + consecutive-miss streak */
function stats(h){
  var cat=CATS[h.cat];
  var createdPS=startPS(h);
  var ps=buildPeriods(h.cat,cat.window);
  var denom=0,numer=0,i,p;
  for(i=0;i<ps.length;i++){ p=ps[i];
    if(p.start<createdPS) continue;
    var done=isDone(h.id,p.key);
    if(p.isCurrent&&!done) continue;
    denom++; if(done) numer++;
  }
  var ratePct=denom>0?Math.round(numer/denom*100):null;
  var miss=0;
  for(i=ps.length-2;i>=0;i--){ p=ps[i];
    if(p.start<createdPS) break;
    if(isDone(h.id,p.key)) break;
    miss++;
  }
  var cur=ps[ps.length-1], curDone=isDone(h.id,cur.key);
  var status,label;
  if(miss===2){status='bad';label='Missed 2 in a row';}
  else if(miss===1&&!curDone){status='warn';label='At risk';}
  else if(ratePct!==null&&ratePct<GOAL){status='warn';label='Below 80%';}
  else if(ratePct!==null&&ratePct>=GOAL){status='ok';label='On track';}
  else {status='new';label='New';}
  return {ratePct:ratePct,miss:miss,status:status,label:label,curKey:cur.key,curDone:curDone,denom:denom};
}

/* window completion for Progress (week | month) */
function windowStats(h,mode){
  var cat=h.cat, now=new Date();
  var createdPS=startPS(h);
  function tally(arr){
    var due=0,done=0;
    for(var i=0;i<arr.length;i++){var p=arr[i];
      if(p.start<createdPS) continue;
      var d=isDone(h.id,p.key);
      if(p.isCurrent&&!d) continue;
      due++; if(d) done++;
    }
    return {due:due,done:done,pct:due?Math.round(done/due*100):null};
  }
  var arr=[],d;
  if(mode==='week'){
    if(cat==='daily'){ d=weekStart(now); while(d<=sod(now)){ arr.push({key:dKey(d),start:sod(d),isCurrent:dKey(d)===dKey(now)}); d=addDays(d,1);} return tally(arr);}
    if(cat==='weekly') return tally([{key:wKey(now),start:weekStart(now),isCurrent:true}]);
    return tally([{key:mKey(now),start:monthStart(now),isCurrent:true}]);
  } else {
    if(cat==='daily'){ d=monthStart(now); while(d<=sod(now)){ arr.push({key:dKey(d),start:sod(d),isCurrent:dKey(d)===dKey(now)}); d=addDays(d,1);} return tally(arr);}
    if(cat==='weekly'){ var ms=monthStart(now); d=weekStart(ms); while(d<=weekStart(now)){ if(addDays(d,6)>=ms){ arr.push({key:wKey(d),start:weekStart(d),isCurrent:wKey(d)===wKey(now)}); } d=addWeeks(d,1);} return tally(arr);}
    return tally([{key:mKey(now),start:monthStart(now),isCurrent:true}]);
  }
}

/* ===================== helpers ===================== */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function statusColor(s){return s==='ok'?'var(--accent)':s==='warn'?'var(--warn)':s==='bad'?'var(--bad)':'var(--text3)';}
function ringSVG(size,stroke,pct,color){
  var R=(size-stroke)/2,C=2*Math.PI*R,sh=pct===null?0:pct,off=C*(1-sh/100),c=size/2;
  var tickA=(GOAL/100)*2*Math.PI;
  var t1x=c+(R-stroke/2-1)*Math.cos(tickA),t1y=c+(R-stroke/2-1)*Math.sin(tickA);
  var t2x=c+(R+stroke/2+1)*Math.cos(tickA),t2y=c+(R+stroke/2+1)*Math.sin(tickA);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="none" stroke="var(--neutral-bg)" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" style="transition:stroke-dashoffset .6s var(--ease)"/>'+
    '<line x1="'+t1x.toFixed(1)+'" y1="'+t1y.toFixed(1)+'" x2="'+t2x.toFixed(1)+'" y2="'+t2y.toFixed(1)+'" stroke="var(--text3)" stroke-width="2" transform="rotate(90 '+c+' '+c+')"/>'+
  '</svg>';
}
var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

/* editable history strip (any past period can be toggled) */
function cellLabel(cat,start,cur){
  if(cat==='daily') return ['S','M','T','W','T','F','S'][start.getDay()]+'<br>'+start.getDate();
  if(cat==='weekly') return cur?'This<br>wk':(start.getMonth()+1)+'/'+start.getDate();
  return cur?'This<br>mo':start.toLocaleString('en-US',{month:'short'});
}
function historyCells(h){

  return ps.map(function(p){
    var done=isDone(h.id,p.key), cls='cell';
    if(done) cls+=' done';

      '<span class="cbox">'+(done?CHECK:'')+'</span>'+

/* ===================== Progress ===================== */
function dailyHeat(mode){
  var dailies=AH().filter(function(h){return h.cat==='daily';});
  if(!dailies.length) return '';
  var now=new Date(),cells=[],d;
  if(mode==='week'){
    d=weekStart(now);
    var dows=['M','T','W','T','F','S','S'],idx=0;
    var html='<div class="heat week">';
    while(idx<7){
      var dd=addDays(d,idx),key=dKey(dd),future=sod(dd)>sod(now);
      var due=dailies.filter(function(h){return startPS(h)<=sod(dd);}).length;
      var done=dailies.filter(function(h){return isDone(h.id,key);}).length;
      var cls=future?'':(done===0?'':(done>=due&&due>0?'p2':'p1'));
      html+='<div class="col"><div class="dn">'+dows[idx]+'</div><div class="hd '+cls+'" style="width:100%">'+
        (future?'':'<div class="dl">'+(done||'')+'</div>')+'</div></div>';
      idx++;
    }
    return html+'</div>';
  } else {
    var ms=monthStart(now),first=weekStart(ms),html2='<div class="heat cal">';
    // leading blanks
    var lead=(ms.getDay()+6)%7,k;
    for(k=0;k<lead;k++) html2+='<div></div>';
    var cur=new Date(ms);
    while(cur.getMonth()===ms.getMonth()){
      var key2=dKey(cur),future2=sod(cur)>sod(now);
      var due2=dailies.filter(function(h){return startPS(h)<=sod(cur);}).length;
      var done2=dailies.filter(function(h){return isDone(h.id,key2);}).length;
      var cls2=future2?'':(done2===0?'':(done2>=due2&&due2>0?'p2':'p1'));
      html2+='<div class="hd '+cls2+'"><div class="dl">'+cur.getDate()+'</div></div>';
      cur=addDays(cur,1);
    }
    return html2+'</div>';
  }
}
function progRow(h,mode){
  var w=windowStats(h,mode), st=stats(h);
  var color=statusColor(w.pct===null?'new':(w.pct>=GOAL?'ok':(st.miss===2?'bad':'warn')));
  var pctTxt=w.pct===null?'—':w.pct+'%';
  return '<div class="prowwrap"><div class="prow">'+
    '<div class="hemo" style="width:32px;height:32px;font-size:17px">'+habitEmoji(h)+'</div>'+
    '<div class="pn">'+esc(h.name)+streakBadge(h)+'</div>'+
    '<div class="pp'+(w.pct===null?' muted':'')+'">'+pctTxt+'</div></div>'+
    '<div class="cnt">'+w.done+' of '+w.due+' '+(CATS[h.cat].units)+(st.miss===2?' · ⚠️ 2 missed in a row':'')+'</div>'+
    '<div style="padding:0 16px"><div class="bar"><i data-w="'+(w.pct||0)+'%" style="background:'+color+'"></i></div></div>'+
    miniSpark(h)+'</div>';
}
function progSection(cat,mode){
  var hs=AH().filter(function(h){return h.cat===cat;});
  if(!hs.length) return '';
  return sectHead(CATS[cat].label,cat)+'<div class="group">'+hs.map(function(h){return progRow(h,mode);}).join('')+'</div>';

function viewProgress(){
  if(!AH().length){
    return '<div class="largetitle">Progress</div><div class="empty"><div class="ico">📊</div><div class="et">Nothing to chart yet</div><div>Add habits on the Today tab and your weekly and monthly progress will show up here.</div></div>';
  }
  // window totals

  var atGoal=AH().filter(function(h){var w=windowStats(h,progMode);return w.pct!==null&&w.pct>=GOAL;}).length;
  var alertList=AH().filter(function(h){return stats(h).miss===2;});
  var color=pct===null?'var(--text3)':(pct>=GOAL?'var(--accent)':'var(--warn)');

  var hero='<div class="hero"><div class="ring">'+ringSVG(84,9,pct,color)+'<div class="v'+(pct===null?' muted':'')+'">'+(pct===null?'—':pct+'%')+'</div></div>'+
    '<div class="meta"><div class="big">'+totDone+' of '+totDue+' completions '+label+'</div>'+
    '<div class="chips"><span class="chip '+(atGoal>0?'ok':'')+'">🏆 '+atGoal+' at goal · 80%+</span>'+
    '<span class="chip '+(alertList.length>0?'bad':'')+'">'+(alertList.length>0?'⚠️':'🛡️')+' '+alertList.length+' streak alert'+(alertList.length===1?'':'s')+'</span></div></div></div>';

  var banner = alertList.length
    ? '<div class="banner bad"><span>⚠️</span><span><b>'+alertList.length+' broke the no-two-in-a-row rule:</b> '+alertList.map(function(h){return esc(h.name);}).join(', ')+'. Complete the current period to recover.</span></div>'
    : '<div class="banner ok"><span>✅</span><span><b>All streaks intact</b> — nothing missed twice in a row.</span></div>';

  var seg='<div class="segmented"><button class="seg'+(progMode==='week'?' on':'')+'" data-mode="week">Week</button><button class="seg'+(progMode==='month'?' on':'')+'" data-mode="month">Month</button></div>';

  var heat=dailyHeat(progMode);
  var heatBlock=heat?'<div class="sectlabel"><span class="em">🔥</span>Daily activity · '+label+'</div><div style="padding:2px">'+heat+'</div>':'';

  return '<div class="largetitle">Progress</div>'+seg+hero+banner+heatBlock+
    progSection('daily',progMode)+progSection('weekly',progMode)+progSection('monthly',progMode);
}

/* ===================== Daily Learning ===================== */
/* Personal per-subject pacing: each subject (Gemara, Halacha, Mussar, Mishnayos,
   Nach, Machshava) can carry its own bookmark into the shared calendar-dated
   schedule, independent of the others and independent of the literal date.
   state.dlbm[key] = {date: <calendar date bookmarked>, set: <date the bookmark was set>} (idx kept for old versions).
   With no bookmark, a subject just follows today's literal calendar row (old
   behavior).

   With a bookmark, content advances one page per REAL content day (Sun–Thu)
   elapsed since the bookmark was set — Fri/Sat are always review (Chazara) on
   the real calendar date, never counted as a pacing step and never skipped by
   one. That keeps review locked to the actual Friday/Saturday no matter what
   day of the week the bookmark started on, instead of drifting with the
   day-of-week offset between when you set it and what page it pointed to. */
function isReviewDate(dateStr){ var d=parseLocal(dateStr).getDay(); return d===5||d===6; } // Fri, Sat
function nearestPos(c,idx){
  for(var i=idx;i>=0;i--){ if(c.pos.hasOwnProperty(i)) return c.pos[i]; }
  for(var j=idx;j<DAILY.length;j++){ if(c.pos.hasOwnProperty(j)) return c.pos[j]; }
  return 0;
}
/* count real learning days after fromDateStr, up through toDate, on which this subject has content
   (Fri/Sat review days and calendar skip days never count as a pacing step) */
function contentDaysElapsed(key,fromDateStr,toDate){
  var si=-1; LEARN_ITEMS.forEach(function(it,i){ if(it[0]===key) si=i; });
  var d=addDays(parseLocal(fromDateStr),1), n=0, end=sod(toDate);
  while(sod(d)<=end){ var k=dKey(d);
    if(!isReviewDate(k)){ var ri=DATE_IDX[k]; if(ri===undefined||DAILY[ri][si+1]) n++; }
    d=addDays(d,1); }
  return n;
}
function effectiveIdx(key){
  var bm=state.dlbm&&state.dlbm[key];
  if(!bm) return learnIndexForToday();
  var today=new Date(), tk=dKey(today);
  if(isReviewDate(tk)) return learnIndexForToday(); // real Fri/Sat: always review, regardless of pace
  var si=-1; LEARN_ITEMS.forEach(function(it,i){ if(it[0]===key) si=i; });
  var ti=DATE_IDX[tk];
  if(ti!==undefined&&!DAILY[ti][si+1]) return ti;   // calendar skip day for this subject: nothing today
  var c=CONTENT[key], start=bmIdx(bm);
  if(!c||!c.idx.length||start===null) return learnIndexForToday();
  var pos=nearestPos(c,start)+contentDaysElapsed(key,bm.set,today);
  if(pos<0) pos=0; if(pos>c.idx.length-1) pos=c.idx.length-1;
  return c.idx[pos];
}
function beyondSchedule(){ return !DAILY.length||dKey(new Date())>DAILY[DAILY.length-1][0]; }
function myLearningItems(){
  var out=[];
  if(beyondSchedule()) return out;
  LEARN_ITEMS.forEach(function(it,i){
    var idx=effectiveIdx(it[0]), row=DAILY[idx];
    if(!row) return;
    var val=row[i+1]; if(!val) return;
    out.push({key:it[0],label:it[1],text:val,date:row[0],bookmarked:!!(state.dlbm&&state.dlbm[it[0]])});
  });
  return out;
}

    '<div class="chips"><span class="chip'+(done===total?' ok':'')+'">'+(done===total?'All done 🎉':'✍️ Tap to check off')+'</span></div></div></div>':'';

      '<span class="check'+(on?' done':'')+'">'+(on?CHECK:'')+'</span>'+

      '<span class="body"><div class="lnm">'+esc(it.label)+'</div><div class="ltxt">'+esc(it.text)+'</div>'+pacecap+'</span></div>';

  return '<div class="largetitle">Daily Learning</div>'+seg+hero+

/* ===================== export ===================== */
function download(filename,text,type){
  var blob=new Blob([text],{type:type});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},500);
}
function exportJSON(){
  download('cadence-'+dKey(new Date())+'.json', JSON.stringify(state,null,2),'application/json');
}
function exportCSV(){
  var rows=[['Habit','Cadence','Period','Start Date','Completed']];
  var caps={daily:366,weekly:106,monthly:37};
  state.habits.forEach(function(h){
    var createdPS=startPS(h);
    var ps=buildPeriods(h.cat,caps[h.cat]);
    ps.forEach(function(p){
      if(p.start<createdPS) return;
      rows.push([h.name,CATS[h.cat].label,p.key,dKey(p.start),isDone(h.id,p.key)?'1':'0']);
    });
  });
  var csv=rows.map(function(r){return r.map(function(c){
    c=String(c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;
  }).join(',');}).join('\n');
  download('cadence-'+dKey(new Date())+'.csv', csv,'text/csv');
}

function exportSMCSV(){
  // mirrors the original spreadsheet: two header rows, then 35 columns per week
  var h1=['Week Ending','Parsha'], h2=['',''];
  for(var a=1;a<=7;a++){
    SM_ITEMS.forEach(function(it,j){ h1.push(j===0?String(a):''); h2.push(it[1]+(it[2]?' '+it[2]:'')); });
  }
  var rows=[h1,h2];
  SCHEDULE.forEach(function(wk){
    var r=[wk[0],wk[1]];
    for(var a=1;a<=7;a++){ SM_ITEMS.forEach(function(it){ r.push(smGet(wk[0],a,it[0])?'TRUE':'FALSE'); }); }
    rows.push(r);
  });
  var csv=rows.map(function(r){return r.map(function(c){
    c=String(c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;
  }).join(',');}).join('\n');
  download('shnayim-mikra-'+dKey(new Date())+'.csv',csv,'text/csv');
}

function exportDLCSV(){
  // mirrors the original Torah Calendar spreadsheet: Date + one column per subject, plus a Done flag per subject
  var header=['Date'];
  LEARN_ITEMS.forEach(function(it){ header.push(it[1]); header.push(it[1]+' Done'); });
  var rows=[header];
  DAILY.forEach(function(row){
    var r=[row[0]];
    for(var i=0;i<LEARN_ITEMS.length;i++){
      var val=row[i+1]||'';
      r.push(val);
      r.push(val && dlGet(row[0],LEARN_ITEMS[i][0])?'TRUE':(val?'FALSE':''));
    }
    rows.push(r);
  });
  var csv=rows.map(function(r){return r.map(function(c){
    c=String(c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;
  }).join(',');}).join('\n');
  download('daily-learning-'+dKey(new Date())+'.csv',csv,'text/csv');
}

/* ===================== actions ===================== */
function toggle(id,key){
  if(!state.log[id]) state.log[id]={};
  if(state.log[id][key]) delete state.log[id][key];
  else { state.log[id][key]=true; justTog=id; }
  save(); render();
  if(navigator.vibrate) try{navigator.vibrate(8);}catch(e){}
}
function toggleCell(id,key){
  if(!state.log[id]) state.log[id]={};
  if(state.log[id][key]) delete state.log[id][key];
  else state.log[id][key]=true;
  save(); refreshHist(); render();
  if(navigator.vibrate) try{navigator.vibrate(6);}catch(e){}
}
function addOrSave(){
  if(sheetLinked){ closeSheet(); return; }
  var name=(document.getElementById('hname').value||'').trim();
  if(!name) return;
  if(sheetEditId){
    var h=state.habits.find(function(x){return x.id===sheetEditId;});
    if(h){ h.name=name; h.cat=sheetCat; }
  } else {
    var nh={id:uid(),name:name,cat:sheetCat,created:dKey(new Date())}; if(sheetEmo) nh.emo=sheetEmo; state.habits.push(nh);
  }
  save(); closeSheet(); render();
}
/* Wipe a single habit's tracked history and re-anchor its start date to today,
   without touching its id/name/position or any other habit. Use this to catch
   up a subject that's fallen behind, instead of it dragging down its % forever. */
function restartHabit(id){
  var h=state.habits.find(function(x){return x.id===id;});
  if(!h) return;
  if(!confirm('Restart "'+h.name+'"? This clears its tracked history and starts fresh from today — nothing before today will count as missed.')) return;
  delete state.log[id];
  h.created=dKey(new Date());
  save(); closeSheet(); render();
}
/* Bookmark every Daily Learning subject to today at once — a fresh personal-pace
   start line across the board, without touching completion history or habits. */
function restartAllLearning(){
  if(!confirm('Restart all Daily Learning subjects from today? Each subject (Gemara, Halacha, Mussar, Mishnayos, Nach, Machshava) will be bookmarked to start fresh from today\'s pace.')) return;
  var idx=learnIndexForToday(), today=dKey(new Date());
  if(!state.dlbm) state.dlbm={};
  LEARN_ITEMS.forEach(function(it){ state.dlbm[it[0]]={idx:idx,date:DAILY[idx][0],set:today}; });
  save(); render();
}
function delHabit(id){
  var h=state.habits.find(function(x){return x.id===id;});
  if(!h) return;
  if(!confirm('Delete "'+h.name+'" and its history?')) return;
  state.habits=state.habits.filter(function(x){return x.id!==id;});
  delete state.log[id];
  save(); closeSheet(); render();
}

content.addEventListener('click',function(e){
  var tog=e.target.closest('[data-toggle]');
  if(tog){ e.stopPropagation(); toggle(tog.getAttribute('data-toggle'),tog.getAttribute('data-key')); return; }
  var sm=e.target.closest('[data-sm]');
  if(sm){ smToggle(sm.getAttribute('data-sm'),sm.getAttribute('data-al'),sm.getAttribute('data-k'));
    render(); if(navigator.vibrate) try{navigator.vibrate(6);}catch(err){} return; }
  var lmode=e.target.closest('[data-lmode]');
  if(lmode){ learnMode=lmode.getAttribute('data-lmode'); render(); return; }
  var pin=e.target.closest('[data-pin]');
  if(pin){ var pk=pin.getAttribute('data-pin');
    if(!state.dlbm) state.dlbm={};
    state.dlbm[pk]={idx:learnIdx,date:DAILY[learnIdx][0],set:dKey(new Date())};
    save(); render(); if(navigator.vibrate) try{navigator.vibrate(10);}catch(err){} return; }
  var unbm=e.target.closest('[data-unbm]');
  if(unbm){ var uk=unbm.getAttribute('data-unbm');
    if(state.dlbm) delete state.dlbm[uk];
    save(); render(); return; }
  var dlt=e.target.closest('[data-dlt]');
  if(dlt){ dlToggle(dlt.getAttribute('data-dlt'),dlt.getAttribute('data-dk'));
    render(); if(navigator.vibrate) try{navigator.vibrate(6);}catch(err){} return; }
  var wk=e.target.closest('[data-wk]');
  if(wk){ var i=parseInt(wk.getAttribute('data-wk'),10);
    if(i>=0&&i<SCHEDULE.length){ smIdx=i; render(); document.getElementById('scroll').scrollTop=0; } return; }
  var dl=e.target.closest('[data-dl]');
  if(dl){ var j=parseInt(dl.getAttribute('data-dl'),10);
    if(j>=0&&j<DAILY.length){ learnIdx=j; render(); document.getElementById('scroll').scrollTop=0; } return; }
  var mode=e.target.closest('[data-mode]');
  if(mode){ progMode=mode.getAttribute('data-mode'); render(); return; }
  var open=e.target.closest('[data-open]');
  if(open){ var h=state.habits.find(function(x){return x.id===open.getAttribute('data-open');}); if(h) openSheet(h); return; }
  var ex=e.target.closest('[data-export]');
  if(ex){ var w=ex.getAttribute('data-export');
    if(w==='json') exportJSON(); else if(w==='csv') exportCSV(); else if(w==='smcsv') exportSMCSV(); else exportDLCSV(); return; }
  if(e.target.closest('[data-reset]')){ if(confirm('Erase ALL habits and history? This cannot be undone.')){ state={habits:[],log:{},sm:{},dl:{},seedv:SEED_VERSION,dlbm:{}}; save(); render(); } return; }
  if(e.target.closest('[data-restartdl]')){ restartAllLearning(); return; }
  if(e.target.closest('[data-refresh]')){ refreshMsg='Checking…'; render(); fetchFreshContent(true); return; }
  if(e.target.closest('[data-seed]')){ seed(); return; }
});

sheet.addEventListener('click',function(e){
  var cell=e.target.closest('[data-cell]');
  if(cell){ toggleCell(cell.getAttribute('data-cell'),cell.getAttribute('data-ck')); return; }
  var eb=e.target.closest('[data-emo]');
  if(eb){ setEmo(eb.getAttribute('data-emo')); return; }
  if(e.target.closest('#emoAuto')){ setEmo(null); return; }
  var sc=e.target.closest('[data-scat]');
  if(sc&&sheetLinked) return;
  if(sc){ sheetCat=sc.getAttribute('data-scat'); document.querySelectorAll('#catSeg .seg').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-scat')===sheetCat);}); emoRefresh(); return; }
  if(e.target.closest('#saveBtn')){ addOrSave(); return; }
  if(e.target.closest('#cancelBtn')){ closeSheet(); return; }
  if(e.target.closest('#restartBtn')){ restartHabit(sheetEditId); return; }
  if(e.target.closest('#delBtn')){ delHabit(sheetEditId); return; }
});
sheet.addEventListener('input',function(e){
  if(e.target.id==='hname'){ emoRefresh(); return; }
  if(e.target.id==='emoType'){
    var v=(e.target.value||'').trim(), first=v;
    if(v){ if(window.Intl&&Intl.Segmenter){ first=Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(v))[0].segment; } else first=Array.from(v)[0]; setEmo(first); }
  }
});
sheet.addEventListener('keydown',function(e){
  if(e.target.id==='hname'&&e.key==='Enter'){ addOrSave(); }
});

/* ===================== boot ===================== */
load(); applyContent(pickLocalContent()); smIdx=smIndexForToday(); learnIdx=learnIndexForToday(); go('today'); fetchFreshContent(false);
})();
</script>
</body>
</html>
